[project]
name = "anderson-erp"
version = "0.1.0"
description = "ERP interno da Anderson Viagem e Turismo: vans, passageiros, pagamentos e contatos"
requires-python = ">=3.11"
dependencies = [
    "fastapi[standard]>=0.143,<0.144",
    "sqlmodel>=0.0.48",
    "pwdlib[argon2]>=0.3",
    "pyjwt>=2.10",
    "httpx>=0.28",
    "psycopg[binary]>=3.2",
    "pydantic-settings>=2.6",
]

[project.optional-dependencies]
dev = ["pytest>=9", "ruff>=0.15"]

[tool.fastapi]
entrypoint = "app.main:app"

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
"app/cli.py" = ["E501"]  # dados de demonstração em linha

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
